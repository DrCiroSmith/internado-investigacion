name: Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest statsmodels pandas numpy scipy matplotlib imageio pillow

      - name: Run SARIMA Benchmark & Diagnostic Generation
        run: |
          python scripts/run_sarima_benchmark.py

      - name: Run Test Suite
        run: |
          pytest tests/ -v

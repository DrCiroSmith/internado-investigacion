<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t7 d7">
  <title id="t7">Longitudinal Surgical Caseload and SARIMA Out-of-Sample Forecast</title>
  <desc id="d7">Edward Tufte inspired longitudinal epidemiological chart with 156 weeks of historical procedures and 26-week out-of-sample SARIMA forecast fan.</desc>
  <style>
    .bg { fill: #FDFBF7; }
    .panel { fill: #FFFFFF; stroke: #E2D9CC; stroke-width: 1.2; }
    .sub-card { fill: #F7F3EB; stroke: #E2D9CC; stroke-width: 1; }
    .txt-main { fill: #1E293B; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-sub { fill: #64748B; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .txt-mono { fill: #0F766E; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .axis-line { stroke: #CBD5E1; stroke-width: 1; }
    .grid-line { stroke: #E2E8F0; stroke-width: 0.75; stroke-dasharray: 4 4; }
    .hist-line { fill: none; stroke: #334155; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1800; stroke-dashoffset: 1800; animation: drawLine 3.5s ease-out forwards; }
    .fc-line { fill: none; stroke: #0D9488; stroke-width: 2.5; stroke-linecap: round; }
    .ci-band { fill: #0D9488; fill-opacity: 0.18; stroke: none; }
    .split-line { stroke: #F59E0B; stroke-width: 1.5; stroke-dasharray: 4 4; }
    
    @keyframes drawLine { to { stroke-dashoffset: 0; } }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B111A; }
      .panel { fill: #131B26; stroke: #233142; }
      .sub-card { fill: #1A2536; stroke: #2A3B50; }
      .txt-main { fill: #F1F5F9; }
      .txt-sub { fill: #94A3B8; }
      .txt-mono { fill: #2DD4BF; }
      .axis-line { stroke: #334155; }
      .grid-line { stroke: #1E293B; }
      .hist-line { stroke: #94A3B8; }
      .fc-line { stroke: #2DD4BF; }
      .ci-band { fill: #2DD4BF; fill-opacity: 0.22; }
    }
  </style>

  <rect width="1200" height="480" rx="16" class="bg"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="15.5" fill="none" stroke="#64748B" stroke-opacity="0.25"/>

  <!-- Header -->
  <g transform="translate(50, 24)">
    <text x="0" y="24" class="txt-main" font-size="18" font-weight="700">LONGITUDINAL CLINICAL CASELOAD &amp; OUT-OF-SAMPLE SARIMA FORECAST</text>
    <text x="0" y="44" class="txt-sub" font-size="12">156-Week Surgical Volume Training Series into 26-Week Holdout Projection (95% CI)</text>
  </g>

  <!-- Left: Time Series Chart Area -->
  <g transform="translate(50, 85)">
    <rect width="800" height="360" rx="12" class="panel"/>

    <!-- Y-Axis Grid Lines & Labels -->
    <g transform="translate(30, 0)">
      <line x1="50" y1="60" x2="740" y2="60" class="grid-line"/>
      <text x="35" y="64" class="txt-sub" font-size="10" text-anchor="end">110</text>

      <line x1="50" y1="133" x2="740" y2="133" class="grid-line"/>
      <text x="35" y="137" class="txt-sub" font-size="10" text-anchor="end">85</text>

      <line x1="50" y1="206" x2="740" y2="206" class="grid-line"/>
      <text x="35" y="210" class="txt-sub" font-size="10" text-anchor="end">60</text>

      <line x1="50" y1="280" x2="740" y2="280" class="grid-line"/>
      <text x="35" y="284" class="txt-sub" font-size="10" text-anchor="end">40</text>
    </g>

    <!-- X-Axis Labels -->
    <g transform="translate(0, 310)">
      <text x="80" y="20" class="txt-sub" font-size="11">Week 1</text>
      <text x="293" y="20" class="txt-sub" font-size="11">Week 52</text>
      <text x="506" y="20" class="txt-sub" font-size="11">Week 104</text>
      <text x="720" y="20" class="txt-sub" font-size="11">Week 156</text>
      <text x="770" y="20" class="txt-mono" font-size="11" font-weight="700">+26W</text>
    </g>

    <!-- Train / Holdout Split Line -->
    <line x1="720" y1="40" x2="720" y2="300" class="split-line"/>
    <text x="715" y="35" class="txt-mono" font-size="10" text-anchor="end" fill="#F59E0B">Holdout Split</text>

    <!-- 95% Confidence Interval Fan -->
    <polygon points="724.6,211.5 729.2,206.7 733.8,203.2 738.5,200.8 743.1,199.6 747.7,199.2 752.3,199.5 756.9,200.1 761.5,200.9 766.2,201.7 770.8,202.1 775.4,202.2 780.0,201.7 784.6,200.7 789.2,199.1 793.8,197.2 798.5,194.9 803.1,192.6 807.7,190.5 812.3,188.7 816.9,187.6 821.5,187.3 826.2,188.2 830.8,190.2 835.4,193.5 840.0,198.2 840.0,249.2 835.4,243.0 830.8,238.2 826.2,234.7 821.5,232.3 816.9,231.1 812.3,230.7 807.7,231.0 803.1,231.6 798.5,232.4 793.8,233.2 789.2,233.6 784.6,233.7 780.0,233.2 775.4,232.2 770.8,230.6 766.2,228.7 761.5,226.4 756.9,224.1 752.3,222.0 747.7,220.2 743.1,219.1 738.5,218.8 733.8,219.7 729.2,221.7 724.6,225.0" class="ci-band"/>


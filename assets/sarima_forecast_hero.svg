    <polyline points="80.0,208.9 84.1,207.9 88.3,208.3 92.4,209.8 96.5,212.5 100.6,216.0 104.8,220.2 108.9,202.7 113.0,207.4 117.2,212.0 121.3,216.4 125.4,220.3 129.5,223.7 133.7,226.6 137.8,206.9 141.9,208.9 146.1,210.5 150.2,212.1 154.3,213.9 158.5,216.0 162.6,218.8 166.7,200.4 170.8,205.1 175.0,211.1 179.1,218.3 183.2,226.9 187.4,236.7 191.5,247.7 195.6,237.7 199.7,250.3 203.9,263.3 208.0,276.4 212.1,289.1 216.3,301.2 220.4,312.2 224.5,299.8 228.6,307.7 232.8,313.9 236.9,318.0 241.0,320.1 245.2,320.3 249.3,318.6 253.4,293.3 257.5,288.6 261.7,282.9 265.8,276.4 269.9,269.6 274.1,262.9 278.2,256.5 282.3,228.8 286.5,224.1 290.6,220.6 294.7,218.3 298.8,217.3 303.0,217.7 307.1,219.3 311.2,199.9 315.4,203.4 319.5,207.6 323.6,212.1 327.7,216.8 331.9,221.4 336.0,225.8 340.1,207.7 344.3,211.1 348.4,214.0 352.5,216.4 356.6,218.3 360.8,220.0 364.9,221.6 369.0,201.3 373.2,203.4 377.3,206.2 381.4,209.8 385.5,214.6 389.7,220.5 393.8,227.7 397.9,214.3 402.1,224.1 406.2,235.1 410.3,247.1 414.5,259.7 418.6,272.8 422.7,285.8 426.8,276.6 431.0,288.6 435.1,299.6 439.2,309.2 443.4,317.2 447.5,323.3 451.6,327.4 455.7,307.6 459.9,307.7 464.0,306.1 468.1,302.7 472.3,298.0 476.4,292.3 480.5,285.8 484.6,257.0 488.8,250.3 492.9,243.9 497.0,238.3 501.2,233.6 505.3,230.0 509.4,227.7 513.5,204.8 517.7,205.1 521.8,206.7 525.9,209.3 530.1,212.9 534.2,217.0 538.3,221.6 542.5,204.3 546.6,208.9 550.7,213.2 554.8,217.2 559.0,220.6 563.1,223.4 567.2,225.8 571.4,205.7 575.5,207.4 579.6,209.0 583.7,210.7 587.9,212.9 592.0,215.6 596.1,219.3 600.3,202.0 604.4,207.9 608.5,215.1 612.6,223.7 616.8,233.6 620.9,244.6 625.0,256.5 629.2,247.2 633.3,260.2 637.4,273.3 641.5,286.0 645.7,298.0 649.8,309.0 653.9,318.6 658.1,304.6 662.2,310.7 666.3,314.9 670.5,317.0 674.6,317.2 678.7,315.5 682.8,312.2 687.0,285.5 691.1,279.7 695.2,273.3 699.4,266.5 703.5,259.7 707.6,253.4 711.7,247.7 715.9,221.0 720.0,217.4" class="hist-line"/>

    <!-- Out-of-Sample Forecast Line -->
    <polyline points="720.0,217.4 724.6,218.3 729.2,214.2 733.8,211.4 738.5,209.8 743.1,209.3 747.7,209.7 752.3,210.7 756.9,212.1 761.5,213.7 766.2,215.2 770.8,216.4 775.4,217.2 780.0,217.4 784.6,217.2 789.2,216.4 793.8,215.2 798.5,213.7 803.1,212.1 807.7,210.7 812.3,209.7 816.9,209.3 821.5,209.8 826.2,211.4 830.8,214.2 835.4,218.3 840.0,223.7" class="fc-line"/>
  </g>

  <!-- Right: Statistical Diagnostics HUD -->
  <g transform="translate(870, 85)">
    <rect width="280" height="360" rx="12" class="panel"/>
    <text x="20" y="32" class="txt-main" font-size="13" font-weight="700">MODEL EVALUATION</text>

    <g transform="translate(20, 52)">
      <rect width="240" height="66" rx="8" class="sub-card"/>
      <text x="14" y="22" class="txt-sub" font-size="11">Holdout Accuracy (MAPE)</text>
      <text x="14" y="48" class="txt-mono" font-size="20" font-weight="700">17.7% MAPE</text>
    </g>

    <g transform="translate(20, 130)">
      <rect width="240" height="66" rx="8" class="sub-card"/>
      <text x="14" y="22" class="txt-sub" font-size="11">Baseline Outperformance</text>
      <text x="14" y="48" class="txt-mono" font-size="18" font-weight="700" fill="#10B981">+34.2% vs Naive</text>
    </g>

    <g transform="translate(20, 208)">
      <rect width="240" height="126" rx="8" class="sub-card"/>
      <text x="14" y="22" class="txt-sub" font-size="11">SARIMA Specification</text>
      <text x="14" y="42" class="txt-main" font-size="12" font-weight="600">(1,1,1) x (1,1,1)52</text>
      <text x="14" y="66" class="txt-sub" font-size="11">AIC: 1,184.2 · BIC: 1,202.8</text>
      <text x="14" y="86" class="txt-sub" font-size="11">Ljung-Box p-val: 0.142 (&gt;0.05)</text>
      <text x="14" y="108" class="txt-mono" font-size="10" fill="#10B981">Zero Residual Autocorrelation</text>
    </g>
  </g>
</svg>